# basic options
title: "Shuvayan Brahmachary"
author: "Shuvayan Brahmachary"
email: "b.shuvayan@gmail.com"
description: "Sr. AI Engineer at Databricks. Agentic AI, scientific machine learning, differentiable physics and computational fluid dynamics."

# site URL config (needed so {{ ... | relative_url }} resolves correctly)
url:  "https://shuvayanb.github.io"
baseurl: "/about"  # your site is published under /about (leading slash so
                   # `jekyll serve` mounts at http://127.0.0.1:4000/about/)

# Content is UTF-8 (en dashes, middots, curly quotes). Set this explicitly so
# the build does not depend on the shell's LANG.
encoding: utf-8

# theme & markdown
# All layouts/includes/styles are local and fully override the theme's.
# minima is kept only so github-pages does not fall back to jekyll-theme-primer.
theme: minima
markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

# analytics
google_analytics: "UA-227511059-1"

# (optional) keep build clean
exclude:
  - node_modules
  - scripts
  - vendor
  - _site
  - Gemfile
  - Gemfile.lock
  - README.md

include:
  - assets/flow/mesh/index.html
  - assets/flow/mesh/pack.json.gz
