<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

{%- assign page_title = page.title | default: site.author -%}
{%- if page.url == "/" -%}
  <title>{{ site.author }} — AI, scientific computing & simulation</title>
{%- else -%}
  <title>{{ page_title }} · {{ site.author }}</title>
{%- endif -%}

<meta name="author" content="{{ site.author }}">
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }} · {{ site.author }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/dp/profilepicture.png' | absolute_url }}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="{{ '/assets/dp/avatar.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

<script>
  /* Applied before first paint so the theme never flashes. */
  (function () {
    try {
      var t = localStorage.getItem('sb-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
  window.SB_ROOT = {{ '/' | relative_url | jsonify }};
</script>
