<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>

<a class="skiplink" href="#main">Skip to content</a>

<div class="shell">
  {% include rail.html %}

  <!-- Persistent simulation surface. Lives in the shell, not in the swapped
       content, so the wave field survives navigation instead of restarting. -->
  <div class="field" aria-hidden="true">
    <canvas class="field__canvas" data-ripple></canvas>
  </div>

  <main class="main" id="main"
        data-nav-id="{{ page.nav_id | default: 'home' }}"
        data-page-title="{{ page.title | default: site.author | xml_escape }}">
    {{ content }}
  </main>
</div>

<script src="{{ '/assets/js/ripple.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/rail.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/pubs.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
</body>
</html>
