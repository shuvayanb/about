---
layout: default
---
<div class="stream stream--page" data-swap>
  <article class="prose">
    <header class="pagehead">
      {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif -%}
      <h1>{{ page.title }}</h1>
      {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif -%}
    </header>

    {{ content }}
  </article>
</div>
